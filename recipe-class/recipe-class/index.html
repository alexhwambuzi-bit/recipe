<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Finder</title>
  </head>

  <body>
    <nav>
      <a href="index1.html">Home</a>
      <a href="#recipes">Recipes</a>
      <a href="#contact">Contact</a>
    </nav>

    <div>
      <h1 class="text-center fs-2 text-white">Healthy Recipe Finder</h1>
    </div>

    <div>
      <h2>Simple, healthy food</h2>
      <p>
        Discover eight quick, whole-food recipes that you can cook tonight <br>— no
        processed junk, no guesswork.
      </p>
      <button>Start exploring</button>
    </div>

    <div>
      <img
        src="images/banner.png"
        alt="Cooking a healthy meal"
      />
    </div>

    <section>
      <h2>Request for a recipe</h2>
      <div>
        <form action="">
          <input type="text" placeholder="Enter email">
          <input type="text" placeholder="Enter full name">
          <textarea name="" rows="5" placeholder="Specify recipe"></textarea>
          <button>Request recipe</button>
        </form>
      </div>
    </section>

    <footer>
      <p>Healthy Recipe Finder | Contact us about your favorite recipe.</p>
    </footer>
  </body>
</html>
